# PromptShield - Postgres + backend + frontend.
# Ollama is NOT in this file: it runs on the host and is reached via host.docker.internal.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback only: reachable for local debugging, not from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"   # pytest/httpx so `make test` works in the container
        INSTALL_ML: "false"   # set to "true" to include torch/transformers (DeBERTa inference) in the image
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ARTIFACTS_DIR: /data/artifacts
      RESULTS_DIR: /data/results
    volumes:
      - ./ml/artifacts:/data/artifacts:ro   # trained detector + calibration (read-only)
      - ./results:/data/results              # exported CSV / LaTeX / PNG
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Docker Desktop

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
